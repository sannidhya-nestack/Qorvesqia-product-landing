<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Ground plane baseline -->
  <line x1="50" y1="210" x2="350" y2="210" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round" />

  <!-- Laser guide beam shooting left -->
  <line x1="168" y1="85" x2="72" y2="85" stroke="#f49600" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" />
  <!-- Laser target crosshair on left -->
  <circle cx="72" cy="85" r="5.5" stroke="#f49600" stroke-width="2" fill="none" />
  <line x1="72" y1="74" x2="72" y2="96" stroke="#f49600" stroke-width="2" stroke-linecap="round" />
  <line x1="61" y1="85" x2="83" y2="85" stroke="#f49600" stroke-width="2" stroke-linecap="round" />

  <!-- Bluetooth wireless telemetry signal waves (radiating to the right) -->
  <path d="M 264 136 A 48 48 0 0 1 270 206" stroke="#f49600" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M 280 122 A 64 64 0 0 1 287 214" stroke="#f49600" stroke-width="2.8" stroke-linecap="round" fill="none" />

  <!-- Top optical emitter head / prism -->
  <rect x="168" y="68" width="56" height="28" rx="3" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.6" stroke-linejoin="round" />
  <circle cx="182" cy="82" r="3.8" fill="#1c1c1c" />
  <line x1="196" y1="78" x2="216" y2="78" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round" />
  <line x1="196" y1="85" x2="210" y2="85" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round" />

  <!-- Laser rangefinder main housing -->
  <path d="M 160 96 
           L 232 96 
           L 236 210 
           L 156 210 
           Z" 
        fill="#ffffff" stroke="#1c1c1c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Ergonomic side grips -->
  <line x1="150" y1="120" x2="157" y2="120" stroke="#1c1c1c" stroke-width="2.4" stroke-linecap="round" />
  <line x1="150" y1="130" x2="157" y2="130" stroke="#1c1c1c" stroke-width="2.4" stroke-linecap="round" />
  <line x1="150" y1="140" x2="157" y2="140" stroke="#1c1c1c" stroke-width="2.4" stroke-linecap="round" />

  <line x1="235" y1="120" x2="242" y2="120" stroke="#1c1c1c" stroke-width="2.4" stroke-linecap="round" />
  <line x1="235" y1="130" x2="242" y2="130" stroke="#1c1c1c" stroke-width="2.4" stroke-linecap="round" />
  <line x1="235" y1="140" x2="242" y2="140" stroke="#1c1c1c" stroke-width="2.4" stroke-linecap="round" />

  <!-- LCD Screen window -->
  <rect x="169" y="108" width="54" height="32" rx="3" fill="#ffffff" stroke="#1c1c1c" stroke-width="2" />
  <!-- Screen readout indicators -->
  <line x1="176" y1="118" x2="194" y2="118" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round" />
  <line x1="176" y1="127" x2="214" y2="127" stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="217" cy="127" r="1.2" fill="#1c1c1c" />
  <line x1="202" y1="118" x2="216" y2="118" stroke="#f49600" stroke-width="2" stroke-linecap="round" />

  <!-- Central measurement button (circle with orange core) -->
  <circle cx="196" cy="160" r="11" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.4" />
  <circle cx="196" cy="160" r="4.2" fill="#f49600" />

  <!-- Bottom panel telemetry dots -->
  <circle cx="168" cy="192" r="2" fill="#f49600" />
  <circle cx="177" cy="192" r="2" fill="#f49600" />
  <circle cx="186" cy="192" r="2" fill="#f49600" />
  <circle cx="195" cy="192" r="2" fill="#f49600" />
  <circle cx="204" cy="192" r="2" fill="#f49600" />
  <circle cx="213" cy="192" r="2" fill="#f49600" />
  <!-- Black status LED -->
  <circle cx="225" cy="192" r="3" fill="#1c1c1c" />
</svg>
