<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <!-- Ground plane baseline -->
  <line x1="50" y1="210" x2="350" y2="210" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round" />

  <!-- Wireless signal waves (radiating to the right) -->
  <path d="M 292 138 A 52 52 0 0 1 298 210" stroke="#f49600" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M 308 124 A 68 68 0 0 1 315 218" stroke="#f49600" stroke-width="2.8" stroke-linecap="round" fill="none" />

  <!-- Top module / spec tab -->
  <rect x="175" y="60" width="50" height="35" rx="3" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.6" stroke-linejoin="round" />
  <line x1="184" y1="72" x2="216" y2="72" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="round" />
  <line x1="184" y1="80" x2="206" y2="80" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="round" />

  <!-- Upper trapezoidal housing -->
  <polygon points="164,95 236,95 264,158 136,158" fill="#ffffff" stroke="#1c1c1c" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Lower base housing with angled feet and cutout arch -->
  <path d="M 136 158 
           L 120 210 
           L 146 210 
           L 155 184 
           L 245 184 
           L 254 210 
           L 280 210 
           L 264 158 
           Z" 
        fill="#ffffff" stroke="#1c1c1c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Front panel telemetry dots (amber/orange) -->
  <circle cx="145" cy="170" r="2" fill="#f49600" />
  <circle cx="156" cy="170" r="2" fill="#f49600" />
  <circle cx="167" cy="170" r="2" fill="#f49600" />
  <circle cx="178" cy="170" r="2" fill="#f49600" />
  <circle cx="189" cy="170" r="2" fill="#f49600" />
  <circle cx="200" cy="170" r="2" fill="#f49600" />
  <circle cx="211" cy="170" r="2" fill="#f49600" />
  <circle cx="222" cy="170" r="2" fill="#f49600" />
  <circle cx="233" cy="170" r="2" fill="#f49600" />
  <circle cx="244" cy="170" r="2" fill="#f49600" />
  <circle cx="255" cy="170" r="2" fill="#f49600" />

  <!-- Status LED / Optical dot (black) -->
  <circle cx="268" cy="170" r="3" fill="#1c1c1c" />
</svg>
